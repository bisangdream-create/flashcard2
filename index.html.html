<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 스마트 플래시카드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <header class="w-full max-w-md text-center py-4">
        <div class="inline-flex items-center justify-center w-12 h-12 bg-indigo-600 rounded-2xl shadow-lg mb-2">
            <i class="fa-solid fa-layer-group text-xl text-white"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight">AI 스마트 플래시카드</h1>
        <p class="text-xs text-slate-400 mt-1">사진에서 단어를 추출하고 나만의 단어장 만들기</p>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-md flex-1 flex flex-col gap-4 pb-6">
        
        <!-- Upload Section -->
        <div class="bg-slate-800 border border-slate-700/60 rounded-2xl p-5 shadow-xl">
            <h2 class="text-sm font-semibold flex items-center gap-2 mb-2 text-indigo-400">
                <i class="fa-solid fa-camera"></i> 사진으로 카드 만들기
            </h2>
            <p class="text-xs text-slate-400 mb-4">교재, 한자, 영어 단어장 사진을 선택하면 AI가 단어·발음·뜻을 추출합니다.</p>
            
            <div class="flex items-center gap-2">
                <label class="flex-1 cursor-pointer bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm py-2.5 px-4 rounded-xl border border-slate-600 text-center font-medium transition flex items-center justify-center gap-2">
                    <i class="fa-regular fa-file-image"></i>
                    <span id="fileNameText">파일 선택</span>
                    <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
                </label>
                <button onclick="convertImageToCards()" id="convertBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm py-2.5 px-5 rounded-xl shadow-lg transition flex items-center gap-2 disabled:opacity-50">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> AI 변환
                </button>
            </div>
        </div>

        <!-- Flashcard Viewport -->
        <div id="flashcardSection" class="hidden flex-1 flex flex-col gap-4">
            
            <!-- Controls Bar -->
            <div class="flex items-center justify-between px-1">
                <span id="cardCounter" class="text-xs font-semibold text-slate-400">1 / 1</span>
                <div class="flex items-center gap-2">
                    <button onclick="toggleReverseMode()" id="reverseModeBtn" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 transition">
                        <i class="fa-solid fa-rotate mr-1"></i> 앞/뒷면 반대로
                    </button>
                    <button onclick="shuffleCards()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 transition">
                        <i class="fa-solid fa-shuffle mr-1"></i> 순서 섞기
                    </button>
                    <button onclick="resetToStart()" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded-lg text-slate-300 transition">
                        <i class="fa-solid fa-rotate-left mr-1"></i> 처음부터 다시
                    </button>
                </div>
            </div>

            <!-- Card 3D Container -->
            <div class="relative w-full aspect-[4/3] perspective-1000 cursor-pointer" onclick="flipCard()">
                <div id="cardInner" class="w-full h-full relative transition-transform duration-500 transform-style-3d rounded-3xl shadow-2xl">
                    
                    <!-- 앞면 (Front) -->
                    <div class="absolute inset-0 w-full h-full bg-slate-800 border border-slate-700 rounded-3xl p-6 flex flex-col items-center justify-center text-center backface-hidden shadow-inner">
                        <span class="absolute top-4 left-4 text-[10px] font-bold uppercase tracking-wider text-indigo-400 bg-indigo-500/10 px-2.5 py-1 rounded-md" id="frontBadge">FRONT</span>
                        <div id="frontContent" class="text-4xl font-extrabold tracking-tight text-white px-4">
                            단어가 여기에 표시됩니다
                        </div>
                        <span class="absolute bottom-4 text-xs text-slate-500"><i class="fa-solid fa-hand-pointer mr-1"></i> 터치해서 뒤집기</span>
                    </div>

                    <!-- 뒷면 (Back) -->
                    <div class="absolute inset-0 w-full h-full bg-indigo-950 border border-indigo-800/60 rounded-3xl p-6 flex flex-col items-center justify-center text-center backface-hidden rotate-y-180 shadow-inner">
                        <span class="absolute top-4 left-4 text-[10px] font-bold uppercase tracking-wider text-indigo-300 bg-indigo-500/20 px-2.5 py-1 rounded-md" id="backBadge">BACK</span>
                        <div id="backContent" class="text-xl font-medium text-indigo-100 px-4 space-y-2">
                            뜻과 해설이 여기에 표시됩니다
                        </div>
                        <span class="absolute bottom-4 text-xs text-indigo-400/60"><i class="fa-solid fa-hand-pointer mr-1"></i> 터치해서 앞면으로</span>
                    </div>

                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex items-center gap-3">
                <button onclick="navigateCard(-1)" class="flex-1 bg-slate-800 hover:bg-slate-700 border border-slate-700 py-3 rounded-2xl font-semibold text-sm transition shadow-md">
                    <i class="fa-solid fa-arrow-left mr-2"></i> 이전 카드
                </button>
                <button onclick="navigateCard(1)" class="flex-1 bg-indigo-600 hover:bg-indigo-500 py-3 rounded-2xl font-semibold text-sm transition shadow-md">
                    다음 카드 <i class="fa-solid fa-arrow-right ml-2"></i>
                </button>
            </div>

        </div>

        <!-- Empty / Guide State -->
        <div id="emptyState" class="flex-1 flex flex-col items-center justify-center text-center p-8 border-2 border-dashed border-slate-800 rounded-3xl">
            <i class="fa-solid fa-book-open text-4xl text-slate-700 mb-3"></i>
            <p class="text-sm text-slate-400 font-medium">등록된 카드가 없습니다.</p>
            <p class="text-xs text-slate-500 mt-1">상단에서 사진을 선택하고 AI 변환을 눌러보세요.</p>
        </div>

    </main>

    <!-- Footer / Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-slate-200 px-4 py-2.5 rounded-xl shadow-2xl border border-slate-700 text-xs font-medium transition-all duration-300 opacity-0 pointer-events-none z-50">
        알림 메시지
    </div>

    <!-- Script Logic -->
    <script>
        let cardsData = [
            { word: "漢字", pronunciation: "한자", meaning: "중국의 글자" },
            { word: "Vocabulary", pronunciation: "/vəˈkæbjuleri/", meaning: "어휘, 단어" }
        ];
        let filteredIndices = [0, 1];
        let currentIndex = 0;
        let isFlipped = false;
        let isReversed = false;
        let selectedImageBase64 = null;
        let selectedMimeType = null;

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2500);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            document.getElementById('fileNameText').innerText = file.name;
            selectedMimeType = file.type;

            const reader = new FileReader();
            reader.onload = function(e) {
                const base64String = e.target.result.split(',')[1];
                selectedImageBase64 = base64String;
                showToast('사진이 선택되었습니다. AI 변환을 눌러주세요.');
            };
            reader.readAsDataURL(file);
        }

        async function convertImageToCards() {
            if (!selectedImageBase64) {
                showToast('먼저 사진 파일을 선택해주세요.');
                return;
            }

            showToast('AI가 단어를 추출하고 있습니다...');
            const btn = document.getElementById('convertBtn');
            btn.disabled = true;

            try {
                // 시뮬레이션 및 실제 Gemini 연동 영역
                setTimeout(() => {
                    cardsData = [
                        { word: "学习 (학습)", pronunciation: "xuéxí", meaning: "공부하다, 배우다" },
                        { word: "environment", pronunciation: "/ɪnˈvaɪrənmənt/", meaning: "환경, 주변 상황" }
                    ];
                    filteredIndices = cardsData.map((_, i) => i);
                    currentIndex = 0;
                    initFlashcards();
                    btn.disabled = false;
                    showToast('단어 카드 생성 완료!');
                }, 1500);
            } catch (err) {
                btn.disabled = false;
                showToast('변환 중 오류가 발생했습니다.');
            }
        }

        function initFlashcards() {
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('flashcardSection').classList.remove('hidden');
            renderCurrentCard();
        }

        function renderCurrentCard() {
            if (filteredIndices.length === 0) return;
            const card = cardsData[filteredIndices[currentIndex]];
            
            document.getElementById('cardCounter').innerText = `${currentIndex + 1} / ${filteredIndices.length}`;

            const frontEl = document.getElementById('frontContent');
            const backEl = document.getElementById('backContent');

            if (!isReversed) {
                document.getElementById('frontBadge').innerText = "FRONT (WORD)";
                document.getElementById('backBadge').innerText = "BACK (MEANING)";
                frontEl.innerHTML = `<div class="text-3xl font-bold">${card.word}</div><div class="text-sm text-indigo-400 mt-2">${card.pronunciation}</div>`;
                backEl.innerHTML = `<div class="text-lg font-semibold text-white">${card.meaning}</div>`;
            } else {
                document.getElementById('frontBadge').innerText = "FRONT (MEANING)";
                document.getElementById('backBadge').innerText = "BACK (WORD)";
                frontEl.innerHTML = `<div class="text-lg font-semibold text-white">${card.meaning}</div>`;
                backEl.innerHTML = `<div class="text-3xl font-bold">${card.word}</div><div class="text-sm text-indigo-300 mt-2">${card.pronunciation}</div>`;
            }

            resetFlipStateSilently();
        }

        function flipCard() {
            isFlipped = !isFlipped;
            const inner = document.getElementById('cardInner');
            if (isFlipped) {
                inner.classList.add('rotate-y-180');
            } else {
                inner.classList.remove('rotate-y-180');
            }
        }

        function resetFlipStateSilently() {
            isFlipped = false;
            const inner = document.getElementById('cardInner');
            inner.classList.remove('rotate-y-180');
        }

        function navigateCard(direction) {
            if (filteredIndices.length <= 1) return;
            resetFlipStateSilently();
            setTimeout(() => {
                currentIndex = (currentIndex + direction + filteredIndices.length) % filteredIndices.length;
                renderCurrentCard();
            }, 150);
        }

        function shuffleCards() {
            filteredIndices.sort(() => Math.random() - 0.5);
            currentIndex = 0;
            resetFlipStateSilently();
            renderCurrentCard();
            showToast('카드 순서가 섞였습니다!');
        }

        function resetToStart() {
            filteredIndices = cardsData.map((_, i) => i);
            currentIndex = 0;
            shuffleCards();
            showToast('처음부터 다시 시작합니다.');
        }

        function toggleReverseMode() {
            isReversed = !isReversed;
            renderCurrentCard();
            showToast(isReversed ? '앞면/뒷면이 반대로 전환되었습니다.' : '기본 모드로 돌아왔습니다.');
        }

        // 초기 실행
        initFlashcards();
    </script>
</body>
</html>
